<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="50%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#5eead4"/>
    </linearGradient>
    <linearGradient id="face" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
  </defs>
  <rect width="192" height="192" rx="42" fill="url(#bg)"/>
  <circle cx="96" cy="78" r="52" fill="url(#face)" stroke="rgba(255,255,255,0.8)" stroke-width="3"/>
  <!-- Nurse cap -->
  <rect x="77" y="20" width="38" height="22" rx="4" fill="white" stroke="#0d9488" stroke-width="2"/>
  <text x="96" y="38" text-anchor="middle" fill="#ef4444" font-size="17" font-weight="bold">+</text>
  <!-- Eyes -->
  <ellipse cx="82" cy="74" rx="5.5" ry="7" fill="#1e293b"/>
  <ellipse cx="110" cy="74" rx="5.5" ry="7" fill="#1e293b"/>
  <circle cx="80" cy="71" r="2" fill="white"/>
  <circle cx="108" cy="71" r="2" fill="white"/>
  <!-- Blush -->
  <ellipse cx="76" cy="86" rx="7" ry="4" fill="#fca5a5" opacity="0.5"/>
  <ellipse cx="116" cy="86" rx="7" ry="4" fill="#fca5a5" opacity="0.5"/>
  <!-- Smile -->
  <path d="M88 88 Q96 98 104 88" fill="#f97316"/>
  <!-- Stethoscope hint -->
  <circle cx="96" cy="118" r="8" fill="none" stroke="#0d9488" stroke-width="2.5"/>
  <path d="M88 118 Q88 108 92 105" fill="none" stroke="#0d9488" stroke-width="2.5"/>
  <path d="M104 118 Q104 108 100 105" fill="none" stroke="#0d9488" stroke-width="2.5"/>
  <!-- Text -->
  <text x="96" y="160" text-anchor="middle" fill="white" font-size="30" font-weight="900" font-family="Arial, sans-serif">당비서</text>
</svg>
